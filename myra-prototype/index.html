<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Myra Import — Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --navy:#0A1B2E; --blue:#008CFF; --ink:#C9D8E6; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--navy); color:#fff;
         font-family:'Plus Jakarta Sans', system-ui, sans-serif; padding:36px 24px 60px; }
  header { max-width:1380px; margin:0 auto; }
  h1 { font-size:30px; margin:0 0 5px; letter-spacing:-0.01em; }
  .sub { color:#9FB3C8; font-size:14.5px; margin:0; }

  .tabs { max-width:1380px; margin:26px auto 0; display:flex; gap:26px;
          border-bottom:1px solid rgba(255,255,255,.14); }
  .tab { background:none; border:0; padding:0 0 12px; font-family:inherit; font-size:15px;
         font-weight:700; color:#7F97B0; cursor:pointer; border-bottom:2.5px solid transparent;
         margin-bottom:-1px; }
  .tab[aria-selected="true"] { color:#fff; border-bottom-color:var(--blue); }

  .panel { max-width:1380px; margin:32px auto 0; }
  .panel[hidden] { display:none; }

  .walk { display:flex; gap:44px; align-items:flex-start; flex-wrap:wrap; }
  .phone { width:390px; height:844px; border-radius:26px; overflow:hidden; flex-shrink:0;
           background:#F4F7FA; box-shadow:0 14px 44px rgba(0,0,0,.45); position:relative; }
  .phone iframe { width:390px; height:844px; border:0; display:block; }
  .phonewrap { flex-shrink:0; }
  .scrollcue { margin:12px 0 0; font-size:12.5px; font-weight:600; color:#7F97B0;
               text-align:center; width:390px; }
  .scrollcue[hidden] { display:none; }
  .side { flex-grow:1; min-width:290px; max-width:430px; padding-top:6px; }
  .step-n { font-size:12px; font-weight:800; letter-spacing:.09em; color:var(--blue); }
  .step-t { font-size:25px; font-weight:800; margin:8px 0 10px; line-height:1.2; }
  .step-d { font-size:14.5px; line-height:1.65; color:var(--ink); margin:0 0 22px; }
  .nav { display:flex; gap:10px; }
  .btn { font-family:inherit; font-size:14px; font-weight:700; padding:12px 20px;
         border-radius:11px; cursor:pointer; border:1.5px solid rgba(255,255,255,.22);
         background:transparent; color:#fff; }
  .btn:disabled { opacity:.32; cursor:default; }
  .btn.primary { background:var(--blue); border-color:var(--blue); }
  .dots { display:flex; gap:7px; margin-top:22px; }
  .dot { width:9px; height:9px; border-radius:5px; background:rgba(255,255,255,.22);
         border:0; padding:0; cursor:pointer; }
  .dot[aria-current="true"] { background:var(--blue); width:22px; }
  .hint { margin:20px 0 0; font-size:12.5px; color:#7F97B0; line-height:1.55; }

  .grid { display:flex; flex-wrap:wrap; gap:30px; align-items:flex-start; }
  figure { margin:0; }
  .grid .shell { width:390px; height:844px; border-radius:22px; overflow:hidden;
                 background:#F4F7FA; box-shadow:0 8px 30px rgba(0,0,0,.35); }
  .grid .shell.tall { height:1330px; }
  .grid iframe { width:390px; border:0; display:block; }
  figcaption { margin-top:11px; font-size:13px; font-weight:700; color:var(--ink); }
</style>
</head>
<body>

<header>
  <h1>Myra Import &mdash; prototype</h1>
  <p class="sub">Team Outliers &middot; IIM Mumbai &middot; MakeMyTrip Young Turks' Business Challenge 2026</p>
</header>

<div class="tabs" role="tablist">
  <button class="tab" role="tab" id="tab-walk" aria-controls="panel-walk" aria-selected="true">Import flow</button>
  <button class="tab" role="tab" id="tab-all" aria-controls="panel-all" aria-selected="false">All screens</button>
</div>

<section class="panel" id="panel-walk" role="tabpanel" aria-labelledby="tab-walk">
  <div class="walk">
    <div class="phonewrap">
      <div class="phone"><iframe id="stage" src="Main.html" title="Myra Import prototype"></iframe></div>
      <p class="scrollcue" id="cue" hidden>&#8597; Taller screen &mdash; scroll inside the frame</p>
    </div>
    <div class="side">
      <div class="step-n" id="sN">STEP 1 OF 7</div>
      <h2 class="step-t" id="sT">Import</h2>
      <p class="step-d" id="sD"></p>
      <div class="nav">
        <button class="btn" id="prev" type="button">Back</button>
        <button class="btn primary" id="next" type="button">Next</button>
      </div>
      <div class="dots" id="dots" aria-label="Steps"></div>
      <p class="hint">Tap the buttons inside the phone and this panel follows along. Taller screens scroll inside the frame, like a real phone.</p>
    </div>
  </div>
</section>

<section class="panel" id="panel-all" role="tabpanel" aria-labelledby="tab-all" hidden>
  <div class="grid" id="grid"></div>
</section>

<script>
var STEPS = [
  { f:'Main.html', h:844, t:'Import', d:'Two doors into one trip: start fresh with Myra, or bring what you already have. Up to ten mixed sources at once — a ChatGPT thread, Reels, a YouTube link, a screenshot, a PDF, a voice note.' },
  { f:'Merging.html', h:844, t:'Merge', d:'Six sources, nineteen mentions, fourteen real items. Duplicates collapse, the order gets worked out, and a clash between the PDF and the voice note is asked about rather than guessed.' },
  { f:'Verifying.html', h:844, t:'Five checks', d:'Is it real? Is it possible? What will it cost? Is it right for you? What are you missing? Four of the five need live inventory — which is why a model cannot do this alone.' },
  { f:'Verified.html', h:1330, t:'The verified plan', d:'Green: bookable with us. Blue: real, but nobody sells it online. Amber: adjusted, with the reason. Red: it does not exist. In our survey only 5.3% of AI plans came back clean.' },
  { f:'Detail.html', h:844, t:'Why we flagged it', d:'Four places we looked, nothing found, three real havelis offered instead. Half the people we surveyed said a system that explains why something will not work is what earns their trust.' },
  { f:'Group.html', h:900, t:'Travelling together', d:'Dates, IDs, clashes, and a split to individual UPI IDs so nobody fronts the whole amount. 83% told us getting everyone’s dates is the worst part.' },
  { f:'Rescue.html', h:900, t:'Refund ≠ Rescue', d:'One cancellation breaks four things. Because the trip is held as one object the chain is known — so you approve once, and it is rebuilt.' }
];

var i = 0;
var stage = document.getElementById('stage');
var dotsEl = document.getElementById('dots');

STEPS.forEach(function (s, n) {
  var b = document.createElement('button');
  b.className = 'dot';
  b.type = 'button';
  b.setAttribute('aria-label', 'Step ' + (n + 1) + ': ' + s.t);
  b.onclick = function () { go(n); };
  dotsEl.appendChild(b);
});

// paint() updates the sidebar only. go() also moves the iframe.
function paint(n) {
  i = n;
  var s = STEPS[i];
  document.getElementById('sN').textContent = 'STEP ' + (i + 1) + ' OF ' + STEPS.length;
  document.getElementById('sT').textContent = s.t;
  document.getElementById('sD').textContent = s.d;
  document.getElementById('prev').disabled = (i === 0);
  document.getElementById('next').disabled = (i === STEPS.length - 1);
  document.getElementById('cue').hidden = (s.h <= 844);
  Array.prototype.forEach.call(dotsEl.children, function (d, n2) {
    d.setAttribute('aria-current', n2 === i ? 'true' : 'false');
  });
}

function go(n) {
  if (stage.getAttribute('src') !== STEPS[n].f) { stage.setAttribute('src', STEPS[n].f); }
  paint(n);
}

document.getElementById('prev').onclick = function () { if (i > 0) { go(i - 1); } };
document.getElementById('next').onclick = function () { if (i < STEPS.length - 1) { go(i + 1); } };

// Each screen posts its own filename on load. file:// iframes are cross-origin, so
// reading contentWindow.location throws — postMessage is the only reliable channel.
window.addEventListener('message', function (e) {
  var d = e.data;
  if (!d || !d.myra) { return; }
  // the All-screens grid frames post too — only listen to the walkthrough frame
  if (e.source !== stage.contentWindow) { return; }
  for (var n = 0; n < STEPS.length; n++) {
    if (STEPS[n].f === d.myra) {
      if (n !== i) { paint(n); }
      return;
    }
  }
});

var grid = document.getElementById('grid');
STEPS.forEach(function (s, n) {
  var fig = document.createElement('figure');
  fig.innerHTML = '<div class="shell' + (s.h > 900 ? ' tall' : '') + '">' +
    '<iframe src="' + s.f + '" title="' + s.t + '" style="height:' + s.h + 'px"></iframe></div>' +
    '<figcaption>' + (n + 1) + ' · ' + s.t + '</figcaption>';
  grid.appendChild(fig);
});

var tabs = [
  { btn: document.getElementById('tab-walk'), panel: document.getElementById('panel-walk') },
  { btn: document.getElementById('tab-all'), panel: document.getElementById('panel-all') }
];
tabs.forEach(function (t) {
  t.btn.onclick = function () {
    tabs.forEach(function (o) {
      var on = (o === t);
      o.btn.setAttribute('aria-selected', on ? 'true' : 'false');
      o.panel.hidden = !on;
    });
  };
});

go(0);
</script>
</body>
</html>
